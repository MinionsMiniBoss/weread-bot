name: Auto Reading Bot Scheduled

on:
  # 每天北京时间 01:00 执行（UTC 为前一天 17:00）。
  schedule:
    - cron: '0 17 * * *'

  repository_dispatch:
    types:
      - weread-bot-reading
  
  # 拉取请求触发，用于测试阅读
  pull_request:
    branches: [ main ]
    paths:
      - 'weread-bot.py'
      - 'requirements.txt'
      - '.github/workflows/auto-reading.yml'
      - '.github/workflows/ci.yml'

  # 手动触发
  workflow_dispatch:
    inputs:
      target_duration:
        description: '阅读时长（分钟，格式：10-20。留空时优先使用仓库 Secret TARGET_DURATION，否则默认 1-2）'
        required: false
        default: ''
        type: string
      reading_mode:
        description: '阅读模式'
        required: false
        default: 'smart_random'
        type: choice
        options:
        - smart_random
        - sequential
        - pure_random
      notify_enabled:
        description: '启用通知'
        required: false
        default: true
        type: boolean
      notify_only_on_failure:
        description: '仅失败时发送通知'
        required: false
        default: false
        type: boolean
      history_enabled:
        description: '启用执行历史持久化'
        required: false
        default: true
        type: boolean
      history_max_entries:
        description: '执行历史最多保留多少条'
        required: false
        default: '50'
        type: string

jobs:
  auto-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Resolve runtime parameters
      env:
        INPUT_TARGET_DURATION: ${{ github.event.inputs.target_duration }}
        SECRET_TARGET_DURATION: ${{ secrets.TARGET_DURATION }}
      run: |
        target_duration="${INPUT_TARGET_DURATION}"

        if [ -z "$target_duration" ]; then
          target_duration="${SECRET_TARGET_DURATION}"
        fi

        if [ -z "$target_duration" ]; then
          target_duration="1-2"
        fi

        echo "TARGET_DURATION=$target_duration" >> "$GITHUB_ENV"

    - name: Create config file
      run: |
        cat > config.yaml <<EOF
        app:
          name: "WeReadBot-GitHub-Action"
          startup_mode: "immediate"
          startup_delay: "1-2"

        reading:
          mode: "${{ github.event.inputs.reading_mode || 'smart_random' }}"
          # 目标阅读时长（分钟），支持区间随机，格式如："1" 或 "1-2"
          target_duration: "${TARGET_DURATION}"
          reading_interval: "30-48"
          use_curl_data_first: true
          fallback_to_config: true
          smart_random:
            book_continuity: 0.8
            chapter_continuity: 0.7
            book_switch_cooldown: 3600

        human_simulation:
          enabled: false
          reading_speed_variation: true
          break_probability: 0.15
          break_duration: "10-20"
          rotate_user_agent: false

        network:
          timeout: 30
          retry_times: 3
          retry_delay: "5-15"
          rate_limit: 10

        notification:
          enabled: ${{ github.event.inputs.notify_enabled != 'false' }}
          include_statistics: true
          only_on_failure: ${{ github.event.inputs.notify_only_on_failure == 'true' }}
          triggers:
            session_success: ${{ github.event.inputs.notify_only_on_failure != 'true' }}
            multi_user_summary: false
            session_failure: true
            runtime_error: true
            general: true

        logging:
          level: "INFO"
          format: "detailed"
          file: "logs/weread.log"
          max_size: "10MB"
          backup_count: 5
          console: true

        history:
          enabled: ${{ github.event.inputs.history_enabled != 'false' }}
          file: "logs/run-history.json"
          max_entries: ${{ github.event.inputs.history_max_entries || '50' }}
          persist_runtime_error: true
        EOF

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run WeRead Bot
      id: read
      env:
        # Cookie刷新QL属性，根据不同用户的环境，可能需要设置为True或False来确保cookie刷新正常工作，默认值为false
        HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}
        # 多用户 cURL：在 WEREAD_CURL_STRING 中放置多段 curl，段与段之间至少插入两个空行
        WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
        # 多用户并发控制，未设置默认 1（顺序执行）
        MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}
        # 通知相关环境变量
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        # 邮件（Apprise）通知改由下方 "Send email notification" 步骤统一发送
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
        GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
        # 代理设置（可选）
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
        SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
        SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
        PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
        PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
        NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || github.event.inputs.notify_only_on_failure == 'true' || 'false' }}
        HISTORY_ENABLED: ${{ secrets.HISTORY_ENABLED || github.event.inputs.history_enabled == 'true' || 'true' }}
        HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}
        HISTORY_MAX_ENTRIES: ${{ secrets.HISTORY_MAX_ENTRIES || github.event.inputs.history_max_entries || '50' }}
        HISTORY_PERSIST_RUNTIME_ERROR: ${{ secrets.HISTORY_PERSIST_RUNTIME_ERROR || 'true' }}
        # 其他环境变量
        TZ: 'Asia/Shanghai'
      run: |
        echo "开始自动阅读任务..."
        echo "当前时间: $(date)"
        echo "运行参数:"
        echo "- 阅读时长: ${TARGET_DURATION}"
        echo "- 阅读模式: ${{ github.event.inputs.reading_mode || 'smart_random' }}"
        echo "- 启用通知: ${{ github.event.inputs.notify_enabled != 'false' }}"
        echo "- 仅失败通知: ${{ github.event.inputs.notify_only_on_failure == 'true' }}"
        echo "- 历史持久化: ${{ github.event.inputs.history_enabled != 'false' }}"
        echo "- 历史保留条数: ${{ github.event.inputs.history_max_entries || '50' }}"
        echo "================================"
        
        # 运行阅读机器人
        python weread-bot.py --config config.yaml

    - name: Upload runtime artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weread-runtime-${{ github.run_id }}
        path: |
          logs/weread.log
          logs/run-history.json
        if-no-files-found: warn
        retention-days: 7

    - name: Send email notification
      if: always()
      continue-on-error: true
      timeout-minutes: 2
      env:
        APPRISE_URL: ${{ secrets.APPRISE_URL }}
        READ_OUTCOME: ${{ steps.read.outcome }}
        NOTIFY_ENABLED: ${{ secrets.NOTIFICATION_ENABLED || github.event.inputs.notify_enabled || 'true' }}
        NOTIFY_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || github.event.inputs.notify_only_on_failure || 'false' }}
      run: |
        is_false() {
          case "$1" in
            [fF][aA][lL][sS][eE]|0|[nN][oO]|[oO][fF][fF]) return 0 ;;
            *) return 1 ;;
          esac
        }

        if [ -z "$APPRISE_URL" ]; then
          echo "未配置 APPRISE_URL，跳过邮件通知"
          exit 0
        fi
        if is_false "$NOTIFY_ENABLED"; then
          echo "通知已关闭，跳过邮件通知"
          exit 0
        fi

        MAIL_DIR=/tmp/weread-mail
        python3 - <<'PYEOF'
        import os
        import pathlib
        import re

        MIN_SUCCESS_RATE = 75.0
        DURATION_RATIO = 0.9
        LOG_PREFIX_RE = re.compile(
            r"^\d{4}-\d{2}-\d{2} [\d:,]+ - [A-Z]+\s+- \[user=[^\]]*\] - "
        )

        log_path = pathlib.Path("logs/weread.log")
        out_dir = pathlib.Path("/tmp/weread-mail")
        out_dir.mkdir(parents=True, exist_ok=True)
        title_path = out_dir / "title.txt"
        body_path = out_dir / "body.txt"
        for path in (title_path, body_path):
            path.unlink(missing_ok=True)

        blocks = []
        current = None
        if log_path.exists():
            for raw_line in log_path.read_text(
                encoding="utf-8", errors="replace"
            ).splitlines():
                line = LOG_PREFIX_RE.sub("", raw_line)
                if "📊 微信读书自动阅读统计报告" in line:
                    current = [line]
                    continue
                if current is not None:
                    current.append(line)
                    if "🎉 本次阅读任务完成" in line:
                        blocks.append("\n".join(current).strip())
                        current = None
            # 日志被截断时仍保留残缺报告，交由 evaluate 标记为未达标
            if current is not None:
                blocks.append("\n".join(current).strip())

        def evaluate(block):
            result = {"reasons": []}
            user_match = re.search(r"用户名称: *(.*)", block)
            result["user"] = (
                user_match.group(1).strip() if user_match else "未知用户"
            )
            rate_match = re.search(r"成功率: ([\d.]+)%", block)
            actual_match = re.search(r"实际阅读: (\d+)分(\d+)秒", block)
            target_match = re.search(r"目标时长: ([\d.]+)分钟", block)

            result["rate"] = None
            if rate_match:
                result["rate"] = float(rate_match.group(1))

            if "🎉 本次阅读任务完成" not in block:
                result["reasons"].append("缺少完成标记")
            if result["rate"] is None:
                result["reasons"].append("未找到成功率")
            elif result["rate"] < MIN_SUCCESS_RATE:
                result["reasons"].append(
                    f"成功率 {result['rate']:.1f}% < {MIN_SUCCESS_RATE:g}%"
                )

            if not actual_match or not target_match:
                result["reasons"].append("未找到阅读时长")
                return result

            actual_seconds = (
                int(actual_match.group(1)) * 60 + int(actual_match.group(2))
            )
            target_minutes = float(target_match.group(1))
            if actual_seconds < target_minutes * 60 * DURATION_RATIO:
                result["reasons"].append(
                    f"实际阅读 {actual_seconds // 60}分"
                    f"{actual_seconds % 60}秒 < 目标 {target_minutes:g}"
                    f"分钟的 {DURATION_RATIO * 100:g}%"
                )
            return result

        results = [evaluate(block) for block in blocks]
        failure_reasons = []
        outcome = os.environ.get("READ_OUTCOME", "").strip()
        if outcome != "success":
            failure_reasons.append(f"运行结果 {outcome or 'unknown'}")
        if not blocks:
            failure_reasons.append("日志中未找到阅读统计报告")
        for result in results:
            for reason in result["reasons"]:
                failure_reasons.append(f"{result['user']}：{reason}")

        ok = not failure_reasons

        only_on_failure = os.environ.get(
            "NOTIFY_ONLY_ON_FAILURE", "false"
        ).strip().lower()
        if only_on_failure in {"true", "1", "yes", "on"} and ok:
            print("仅失败时通知：本次结果达标，跳过邮件通知")
            raise SystemExit(0)

        server_url = os.environ.get("GITHUB_SERVER_URL", "")
        repository = os.environ.get("GITHUB_REPOSITORY", "")
        run_id = os.environ.get("GITHUB_RUN_ID", "")
        run_url = (
            f"{server_url}/{repository}/actions/runs/{run_id}"
            if server_url and repository and run_id else "（未提供）"
        )

        rates = [result["rate"] for result in results if result["rate"] is not None]
        passed = sum(1 for result in results if not result["reasons"])

        lines = [
            f"结果：{'✅ 全部达标' if ok else '❌ 未达标'}",
            f"达标用户：{passed}/{len(results)}",
        ]
        if rates:
            lines.append(f"最低成功率：{min(rates):.1f}%")
        lines.append(f"运行记录：{run_url}")
        if not ok:
            lines.append("")
            lines.append("未达标原因：")
            lines.extend(f"- {reason}" for reason in failure_reasons)
        lines.append("")
        lines.append("—— 阅读统计 ——")
        if blocks:
            for block in blocks:
                lines.extend(["", block])
        else:
            lines.extend(["", "（无可用统计报告，请查看 workflow 日志）"])
        lines.extend([
            "",
            "—— 判定标准 ——",
            f"成功率 ≥ {MIN_SUCCESS_RATE:g}%，"
            f"实际阅读 ≥ 目标时长的 {DURATION_RATIO:g} 倍，且运行结果成功",
        ])

        title_path.write_text(
            f"{'✅' if ok else '❌'} 微信读书自动阅读报告", encoding="utf-8"
        )
        body_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
        print(f"邮件判定：{'成功' if ok else '失败'}，统计报告 {len(blocks)} 份")
        PYEOF

        if [ ! -f "$MAIL_DIR/title.txt" ]; then
          exit 0
        fi

        # Apprise CLI 从环境变量读取 URL，不写文件或将 URL 放到命令参数。
        export APPRISE_URLS="$APPRISE_URL"
        if apprise --title "$(cat "$MAIL_DIR/title.txt")" \
            --body "$(cat "$MAIL_DIR/body.txt")" >/dev/null 2>&1; then
          echo "邮件通知已发送"
        else
          echo "邮件通知发送失败（通知 URL 和原始错误已隐藏）"
          exit 1
        fi
